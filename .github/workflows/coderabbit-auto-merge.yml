name: CodeRabbit auto merge

on:
  status:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.context == 'CodeRabbit' && github.event.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge labeled pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.sha }}
        run: |
          gh api "repos/${REPOSITORY}/commits/${SHA}/pulls" \
            --jq '.[] | select(.state == "open") | select(.base.ref == "main") | select(any(.labels[]; .name == "automerge")) | .number' |
          while read -r pr; do
            if [ -n "$pr" ]; then
              gh pr merge "$pr" --repo "$REPOSITORY" --merge --delete-branch
            fi
          done
