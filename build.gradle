// 루트 프로젝트는 빌드 산출물을 만들지 않는다.
// 플러그인 버전만 한곳에서 선언하고, 실제 적용은 각 하위 프로젝트가 한다.
plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    group = 'com.example'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}
