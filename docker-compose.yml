services:
  mariadb:
    image: mariadb:11.4
    container_name: talking-bank-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: talkingbank
      MARIADB_USER: talkingbank
      MARIADB_PASSWORD: talkingbank
      MARIADB_ROOT_PASSWORD: root
    ports:
      # 로컬 MariaDB(3306)·다른 프로젝트 컨테이너(3307)와 겹치지 않도록 호스트 포트는 3308을 쓴다.
      - "3308:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:
