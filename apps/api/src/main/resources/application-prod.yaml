# 운영. SPRING_PROFILES_ACTIVE=prod 로 기동한다. 비밀값은 서버의 apps/api/.env 에서 읽는다.
# DB 설정(MariaDB URL · 계정)은 AUTH-01에서 인프라가 정해지면 여기에 추가한다. 그 전까지 prod 프로필은 기동되지 않는다.
spring:
  jpa:
    hibernate:
      # 운영에서는 스키마를 자동으로 바꾸지 않는다.
      ddl-auto: validate

jwt:
  # 기본값 없음. .env 에 JWT_SECRET(32자 이상)이 없으면 기동이 실패한다 — 개발용 시크릿이 운영에 쓰이는 일을 막는다.
  secret: ${JWT_SECRET}

auth:
  # HTTPS 전제.
  cookie-secure: true

logging:
  level:
    com.example.talkingbank: info
