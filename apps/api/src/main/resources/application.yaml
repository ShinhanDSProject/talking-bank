# 모든 환경 공통. 환경별 차이는 application-<profile>.yaml, 비밀은 .env 에 둔다.
spring:
  application:
    name: talking-bank
  profiles:
    # 프로필을 지정하지 않으면 local. 서버에서는 SPRING_PROFILES_ACTIVE=prod
    default: local
  config:
    # apps/api/.env 를 properties로 읽는다. 파일이 없어도 기동된다. 비밀값(JWT_SECRET 등)은 여기에만 둔다 — Git 제외.
    import: optional:file:./.env[.properties]
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    # 응답의 날짜·시각은 ISO 8601 + 오프셋(+09:00)으로 나간다.
    time-zone: Asia/Seoul

jwt:
  # 시크릿은 프로필별 파일에서 정한다. local은 개발용 기본값이 있고, prod는 .env 의 JWT_SECRET 이 없으면 기동이 실패한다.
  access-token-validity: 30m
  refresh-token-validity: 7d

auth:
  # 연속 로그인 실패 허용 횟수. 개발 중 잠기는 게 번거로우면 .env 에 MAX_LOGIN_FAIL=999
  max-login-fail-count: ${MAX_LOGIN_FAIL:5}
