spring:
  application:
    name: talking-bank
  profiles:
    # 프로필을 지정하지 않고 실행하면 로컬 개발 설정을 쓴다.
    default: local
  datasource:
    # 인메모리 H2. 서버를 내리면 데이터가 사라지고, 다시 올리면 AccountSeeder가 예시 데이터를 넣는다.
    url: jdbc:h2:mem:talkingbank;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.talkingbank: debug
