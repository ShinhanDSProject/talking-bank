spring:
  profiles:
    # 로컬 시드 데이터(AccountSeeder)가 끼어들지 않도록 test 프로필로 돌린다.
    default: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: test-only-secret-key-that-is-at-least-32-characters-long
  access-token-validity: 30m
  refresh-token-validity: 7d

auth:
  max-login-fail-count: 5
  cookie-secure: false

logging:
  level:
    com.example.talkingbank: info
