spring:
  profiles:
    # 로컬 시드 데이터(AccountSeeder)가 끼어들지 않도록 test 프로필로 돌린다.
    default: test
  datasource:
    url: jdbc:h2:mem:talkingbank;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.example.talkingbank: info
